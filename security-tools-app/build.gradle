plugins {
    id 'application'
    id 'com.skyworth.car.version' version '1.0.0'
}

group = 'io.github.jebai'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

def useLocal = project.hasProperty('useLocal')
def localLibraryPath = project.findProperty('localLibraryPath') ?: '../security-tools/build/libs'

repositories {
    if (useLocal) {
        flatDir {
            dirs localLibraryPath
        }
    } else {
        mavenCentral()
        // maven {
        //     name = 'Central Portal Snapshots'
        //     url = 'https://central.sonatype.com/repository/maven-snapshots/'

        //     // Only search this repository for the specific dependency
        //     content {
        //         includeModule('io.github.jebai', 'security-tools')
        //     }
        // }
    }
}

dependencies {
    if (useLocal) {
        implementation name: 'security-tools-1.0.0'
    } else {
        implementation 'io.github.jebai:security-tools:1.0.4'
    }
}

application {
    mainClass = 'App'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
